
spring.application.name=BE

# Ket noi MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_cuoc_hop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Port backend
server.port=8080

# JWT Configuration
jwt.secret=meeting-system-dev-secret-key-2026-change-this-before-production-01
jwt.expiration=86400000
logging.level.org.springframework.security=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.profiles.default=gmail

app.upload.de-xuat-dir=uploads/de-xuat-cuoc-hop

app.bieu-quyet.khoa-phieu=${BIEU_QUYET_KHOA_PHIEU:}